<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#06080e" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#1e2638" stroke-width="4" fill="none" />

  <!-- Ticket Body with Glow -->
  <g filter="url(#glow)">
    <path d="M128 176 C128 158.3 142.3 144 160 144 L352 144 C369.7 144 384 158.3 384 176 L384 224 C366.3 224 352 238.3 352 256 C352 273.7 366.3 288 384 288 L384 336 C384 353.7 369.7 368 352 368 L160 368 C142.3 368 128 353.7 128 336 L128 288 C145.7 288 160 273.7 160 256 C160 238.3 145.7 224 128 224 Z" fill="url(#brandGrad)" />
  </g>

  <!-- Perforated Divider Line -->
  <line x1="220" y1="164" x2="220" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" opacity="0.4" />

  <!-- Star / Play Icon inside Ticket -->
  <circle cx="304" cy="256" r="44" fill="#ffffff" opacity="0.15" />
  <polygon points="292,234 326,256 292,278" fill="#ffffff" />

  <!-- Accent sparkles -->
  <circle cx="180" cy="210" r="8" fill="url(#goldGrad)" />
  <circle cx="180" cy="302" r="8" fill="url(#goldGrad)" />
</svg>
